 콘센트에서 충전합니다. 선이 엉키고 누구 것인지 헷갈리며 바닥에 걸려 넘어지기도 합니다."},{id:"p13",category:"집·생활",title:"화분에 물 주는 것을 잊는다",scene:"베란다 화분이 자주 시듭니다. 언제 물을 줬는지 기억이 안 나고, 여행을 가면 물을 줄 사람이 없습니다."},{id:"p14",category:"안전·교통",title:"등굣길 횡단보도가 위험하다",scene:"학교 앞 횡단보도에 아침마다 차와 학생이 몰립니다. 키 작은 학생은 운전자 눈에 잘 띄지 않습니다."},{id:"p15",category:"안전·교통",title:"밤길 자전거가 잘 보이지 않는다",scene:"해가 진 뒤 자전거를 타고 귀가하면 차나 보행자가 자전거를 늦게 알아챕니다."},{id:"p16",category:"안전·교통",title:"겨울 계단이 얼어 미끄럽다",scene:"눈이 온 다음 날 학교 바깥 계단이 얼어 있습니다. 소금을 뿌려도 그늘진 곳은 계속 미끄럽습니다."},{id:"p17",category:"안전·교통",title:"버스에서 내릴 정류장을 놓친다",scene:"처음 가는 길에 버스를 탔는데 안내 방송이 잘 들리지 않아 내릴 정류장을 지나쳤습니다."},{id:"p18",category:"안전·교통",title:"지진 대피 때 머리를 보호하기 어렵다",scene:"지진 대피 훈련에서 책상 밑으로 숨었다가 운동장으로 나갑니다. 이동하는 동안 머리를 보호할 것이 마땅치 않습니다."},{id:"p19",category:"환경",title:"분리배출이 헷갈린다",scene:"교실 분리수거함에 종이, 플라스틱, 일반 쓰레기가 섞여 있습니다. 무엇을 어디에 버려야 할지 헷갈려 합니다."},{id:"p20",category:"환경",title:"급식 잔반이 많이 남는다",scene:"매일 급식이 끝나면 잔반통이 가득 찹니다. 싫어하는 반찬은 거의 손대지 않고 버려집니다."},{id:"p21",category:"환경",title:"여름에 교실 전기를 너무 많이 쓴다",scene:"쉬는 시간에도 에어컨과 전등이 켜져 있습니다. 교실이 비어 있을 때도 끄는 사람이 없습니다."},{id:"p22",category:"환경",title:"바닷가에 쓰레기가 밀려온다",scene:"동해안 바닷가에 페트병과 스티로폼 조각이 밀려와 쌓입니다. 모래 속에 묻힌 작은 조각은 줍기 어렵습니다."},{id:"p23",category:"환경",title:"일회용 컵 사용이 줄지 않는다",scene:"학교 행사 때마다 종이컵과 플라스틱 컵이 수백 개씩 버려집니다. 개인 컵은 챙겨 오는 사람이 적습니다."},{id:"p24",category:"건강·운동",title:"책가방이 너무 무겁다",scene:"교과서와 준비물을 모두 넣은 책가방이 무거워 등하굣길에 어깨와 허리가 아픕니다."},{id:"p25",category:"건강·운동",title:"물을 충분히 마시지 않는다",scene:"학생들이 하루 종일 물을 거의 마시지 않습니다. 정수기까지 가기 귀찮고, 마셔야 할 때를 잊어버립니다."},{id:"p26",category:"건강·운동",title:"바른 자세로 앉기 어렵다",scene:"공부할 때 몸이 점점 앞으로 숙여지고 다리를 꼬게 됩니다. 수업이 끝나면 목과 허리가 뻐근합니다."},{id:"p27",category:"건강·운동",title:"줄넘기 연습을 혼자 하기 어렵다",scene:"줄넘기 급수 시험을 준비하는데 몇 개를 넘었는지 세기 어렵고, 줄이 자꾸 발에 걸립니다."},{id:"p28",category:"함께 사는 세상",title:"휠체어로 교실에 들어가기 어렵다",scene:"다리를 다친 친구가 휠체어를 탑니다. 교실 문턱과 좁은 책상 사이를 지나기 어렵습니다."},{id:"p29",category:"함께 사는 세상",title:"할머니가 약 먹을 시간을 잊는다",scene:"할머니가 하루 세 번 다른 약을 드셔야 하는데 이미 드셨는지 헷갈려 하십니다."},{id:"p30",category:"함께 사는 세상
